name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SECRET_KEY: ci-test-secret-not-for-production
      DEBUG: "true"
      SQLITE_NAME: "ci_vault.sqlite3"
      RATE_LIMIT_ALLOW_MEMORY: "1"
      # Forcer SQLite (pas de Postgres en CI)
      DATABASE_URL: ""
      DIRECT_DATABASE_URL: ""

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test vault.tests --verbosity 2
